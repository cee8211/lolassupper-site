<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F6F2EB">
  <title>A Sicilian Affair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #F6F2EB;
      --card:        #FFFFFF;
      --border:      rgba(0,0,0,0.09);
      --border-hi:   rgba(0,0,0,0.22);
      --red:         #8B1A1A;
      --red-hover:   #A01D1D;
      --gold:        #7A5808;
      --gold-bg:     rgba(122,88,8,0.06);
      --gold-border: rgba(122,88,8,0.22);
      --ink:         #1A1614;
      --ink-dim:     #4A3E35;
      --muted:       #8A7A6A;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Lora', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── TOP BAR ── */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(246,242,235,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .top-bar-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .top-bar-name {
      flex: 1;
      min-width: 0;
    }
    .top-bar-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-bar-role {
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rules-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 7px 14px;
      font-family: 'Lora', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .rules-btn:hover { border-color: var(--border-hi); color: var(--ink-dim); }

    /* ── PAGE ── */
    .page {
      padding: 20px 16px 80px;
      max-width: 540px;
      margin: 0 auto;
    }

    /* ── SECTION ── */
    .section { margin-bottom: 28px; }
    .section-title {
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── OVERVIEW ── */
    .summary-text {
      font-size: 1.05rem;
      font-style: italic;
      line-height: 1.75;
      color: var(--ink-dim);
      margin-bottom: 12px;
    }
    .expand-btn {
      background: transparent;
      border: none;
      padding: 0;
      font-family: 'Lora', serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .expand-btn-arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-style: normal;
    }
    .expand-btn-arrow.open { transform: rotate(180deg); }

    .bio-paras {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bio-paras p {
      font-size: 1rem;
      line-height: 1.78;
      color: var(--ink-dim);
    }
    .valet-block {
      margin-top: 14px;
      padding: 12px 14px;
      background: rgba(139,26,26,0.04);
      border: 1px solid rgba(139,26,26,0.16);
      border-radius: 2px;
    }
    .valet-label {
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 6px;
    }
    .valet-block p {
      font-size: 0.95rem;
      font-style: italic;
      line-height: 1.68;
      color: var(--ink-dim);
    }

    /* ── GOALS ── */
    .goals-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .goals-list li {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--ink-dim);
      padding-left: 18px;
      position: relative;
    }
    .goals-list li::before {
      content: '◆';
      position: absolute;
      left: 0;
      font-size: 0.45rem;
      top: 6px;
      color: var(--gold);
    }

    /* ── FIRST MOVES ── */
    .first-moves {
      background: var(--gold-bg);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
      padding: 16px;
    }
    .first-moves-label {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .moves-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .moves-list li {
      font-size: 0.97rem;
      line-height: 1.55;
      color: var(--ink-dim);
      padding-left: 18px;
      position: relative;
    }
    .moves-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--gold);
    }

    /* ── SPECIAL RULES (Carmen) ── */
    .special-block {
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 0.92rem;
      line-height: 1.65;
      color: var(--ink-dim);
      font-style: italic;
    }

    /* ── OTHER PEOPLE ── */
    .people-list { display: flex; flex-direction: column; gap: 10px; }
    .person-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px;
    }
    .person-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .person-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 3px;
    }
    .person-note {
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--ink-dim);
    }

    /* ── ABILITIES ── */
    .abilities-locked-note {
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--red);
      background: rgba(139,26,26,0.06);
      border: 1px solid rgba(139,26,26,0.2);
      border-radius: 2px;
      padding: 9px 12px;
      margin-bottom: 12px;
      font-style: italic;
    }
    .abilities-list { display: flex; flex-direction: column; gap: 12px; }

    /* Sealed abilities — blurred until 5pm CET Saturday when the game begins */
    .abilities-wrap { position: relative; }
    .abilities-list--sealed {
      filter: blur(7px);
      user-select: none;
      pointer-events: none;
      transition: filter 0.35s;
    }
    .abilities-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: rgba(246,242,235,0.55);
      backdrop-filter: blur(2px);
      border: 1px solid var(--gold-border);
      border-radius: 2px;
    }
    .abilities-overlay-label {
      font-family: 'Playfair Display', serif;
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .abilities-overlay-text {
      font-size: 0.98rem;
      font-style: italic;
      line-height: 1.5;
      color: var(--ink-dim);
      max-width: 280px;
      margin-bottom: 14px;
    }
    .abilities-overlay-time {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.04em;
    }
    .ability-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 14px;
    }
    .ability-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 5px;
    }
    .ability-desc {
      font-size: 0.93rem;
      line-height: 1.55;
      color: var(--ink-dim);
      margin-bottom: 12px;
    }
    .ability-circles {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }
    .use-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border-hi);
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .use-circle:hover { border-color: var(--gold); }
    .use-circle.filled { background: var(--ink); border-color: var(--ink); }
    .use-circle.filled::after {
      content: '✕';
      font-size: 0.55rem;
      color: #fff;
      font-weight: 700;
    }
    .per-player-counter {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .counter-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border-hi);
      background: transparent;
      color: var(--ink-dim);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .counter-val {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--ink);
      min-width: 28px;
      text-align: center;
    }
    .counter-label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── SECRET & CLUE ── */
    .sc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 380px) { .sc-grid { grid-template-columns: 1fr; } }
    .sc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s;
      min-height: 110px;
      display: flex;
      flex-direction: column;
    }
    .sc-card:hover { border-color: var(--border-hi); }
    .sc-card--secret { border-color: rgba(139,26,26,0.22); }
    .sc-card--clue   { border-color: var(--gold-border); }
    .sc-label {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .sc-card--secret .sc-label { color: var(--red); }
    .sc-card--clue   .sc-label { color: var(--gold); }
    .sc-text {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--ink-dim);
      flex: 1;
      transition: filter 0.25s;
    }
    .sc-text--blur { filter: blur(6px); user-select: none; pointer-events: none; }
    .sc-hint {
      margin-top: 10px;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    /* ── RULES SHEET ── */
    .rules-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26,22,20,0.4);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .rules-backdrop.open { opacity: 1; pointer-events: all; }
    .rules-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 101;
      background: var(--card);
      border-radius: 12px 12px 0 0;
      border-top: 1px solid var(--border);
      padding: 0 20px calc(env(safe-area-inset-bottom) + 24px);
      max-height: 82vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      -webkit-overflow-scrolling: touch;
    }
    .rules-sheet.open { transform: translateY(0); }
    .rules-sheet::-webkit-scrollbar { display: none; }
    .rules-handle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 12px;
      position: sticky;
      top: 0;
      background: var(--card);
    }
    .rules-handle {
      width: 36px;
      height: 4px;
      background: var(--border-hi);
      border-radius: 2px;
      margin: 0 auto;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 10px;
    }
    .rules-close {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      margin-left: auto;
      line-height: 1;
    }
    .rules-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 18px;
    }
    .rules-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .rule-item { display: flex; gap: 12px; }
    .rule-num {
      font-family: 'Playfair Display', serif;
      font-size: 0.8rem;
      color: var(--gold);
      font-weight: 700;
      flex-shrink: 0;
      padding-top: 2px;
      min-width: 18px;
    }
    .rule-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--ink-dim);
    }
    .rule-text strong { color: var(--ink); font-weight: 600; }

    /* ── FAMILY TREE SHEET ── */
    .tree-note {
      font-size: 0.85rem;
      font-style: italic;
      text-align: center;
      color: var(--ink-dim);
      margin: -8px 0 16px;
    }
    .tree-svg-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
    }
    .tree-svg-wrap svg {
      display: block;
      min-width: 920px;
      height: auto;
    }
    .tree-name       { font-size: 17px; font-weight: 700; fill: var(--ink); font-family: 'Lora', serif; }
    .tree-name-plain { font-size: 17px; font-weight: 400; fill: var(--ink-dim); font-family: 'Lora', serif; }
    .tree-eq         { font-size: 15px; font-weight: 700; fill: var(--ink); font-family: 'Lora', serif; }
    .tree-side-name  { font-size: 15px; font-weight: 700; fill: var(--ink); font-family: 'Lora', serif; }
    .tree-side-header{ font-size: 13px; font-style: italic; fill: var(--muted); font-family: 'Lora', serif; }
    .tree-line       { stroke: var(--ink); stroke-width: 1.5; fill: none; }

    /* ── PREVIEW / COUNTDOWN ── */
    .preview {
      padding: 32px 20px 60px;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
    }
    .preview-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 400;
      text-align: center;
      color: var(--ink);
      line-height: 1.15;
      margin-bottom: 4px;
    }
    .preview-role {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }
    .preview-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 22px 20px;
      margin-bottom: 36px;
    }
    .preview-summary {
      font-size: 1.05rem;
      font-style: italic;
      line-height: 1.78;
      color: var(--ink-dim);
    }
    .preview-sealed-label {
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .countdown {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .cd-unit { text-align: center; min-width: 52px; }
    .cd-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
      display: block;
    }
    .cd-label {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-top: 5px;
    }
    .cd-sep {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--muted);
      opacity: 0.3;
      padding-top: 2px;
      user-select: none;
    }

    /* ── LOGOUT ── */
    .logout-row {
      text-align: center;
      padding-top: 8px;
    }
    .logout-btn {
      background: transparent;
      border: none;
      font-family: 'Lora', serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      padding: 8px 16px;
    }

  </style>
</head>
<body>
<div id="app">

  <template v-if="char">

    <!-- ── TOP BAR ── -->
    <div class="top-bar">
      <button class="rules-btn" @click="logout">←</button>
      <div class="top-bar-avatar" :style="{ background: char.color }">{{ char.initials }}</div>
      <div class="top-bar-name">
        <div class="top-bar-title">{{ char.name }}</div>
        <div class="top-bar-role">{{ char.role }}</div>
      </div>
      <button v-if="isLive" class="rules-btn" @click="treeOpen = true">Tree</button>
      <button class="rules-btn" @click="rulesOpen = true">Rules</button>
    </div>

    <!-- ── PREVIEW (before reveal) ── -->
    <div v-if="!isRevealed" class="preview">
      <div class="preview-avatar" :style="{ background: char.color }">{{ char.initials }}</div>
      <h2 class="preview-name">{{ char.name }}</h2>
      <p class="preview-role">{{ char.role }}</p>
      <div class="preview-card">
        <p class="preview-summary">{{ char.summary }}</p>
      </div>
      <p class="preview-sealed-label">Your full dossier is sealed</p>
      <div v-if="countdown" class="countdown">
        <template v-if="countdown.days > 0">
          <div class="cd-unit">
            <span class="cd-num">{{ countdown.days }}</span>
            <span class="cd-label">{{ countdown.days === 1 ? 'day' : 'days' }}</span>
          </div>
          <span class="cd-sep">:</span>
        </template>
        <div class="cd-unit">
          <span class="cd-num">{{ String(countdown.hours).padStart(2,'0') }}</span>
          <span class="cd-label">hrs</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-unit">
          <span class="cd-num">{{ String(countdown.mins).padStart(2,'0') }}</span>
          <span class="cd-label">min</span>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-unit">
          <span class="cd-num">{{ String(countdown.secs).padStart(2,'0') }}</span>
          <span class="cd-label">sec</span>
        </div>
      </div>
    </div>

    <!-- ── FULL PAGE CONTENT (after reveal) ── -->
    <div v-if="isRevealed" class="page">

      <!-- OVERVIEW -->
      <div class="section">
        <div class="section-title">Your character</div>

        <p class="summary-text">{{ char.summary }}</p>

        <button class="expand-btn" @click="bioOpen = !bioOpen">
          {{ bioOpen ? 'Show less' : 'Read full background' }}
          <span class="expand-btn-arrow" :class="{ open: bioOpen }">▾</span>
        </button>

        <div v-if="bioOpen" class="bio-paras">
          <p v-for="(para, i) in char.bio" :key="i">{{ para }}</p>
          <div v-if="char.valet" class="valet-block">
            <div class="valet-label">How you feel about the valet's death</div>
            <p>{{ char.valet }}</p>
          </div>
        </div>
      </div>

      <!-- SPECIAL RULES -->
      <div class="section" v-if="char.special">
        <div class="section-title">Special rules</div>
        <div class="special-block">{{ char.special }}</div>
      </div>

      <!-- GOALS -->
      <div class="section">

      'You are introducing yourself as Nick Johnson, an old schoolfriend of Maria Moretti\'s. That\'s a lie. Your real name is Niko Kontos, and you are a smooth-talking operator who makes a living preying on well-off women by learning their secrets and threatening ruin.',
      'You seduced Maria in New York when she was a young woman but abandoned her when you realized her family wasn\'t as wealthy as you\'d believed. Her brother Jimmy took her to Boston, where she met Salvatore Moretti.',
      'Within a few weeks, Salvatore had swept Maria off her feet. You returned to Maria two weeks before her wedding, saying that you loved her and promising to marry her. It worked, and you tricked her into a night of passion. The next day you laughed, and left again. Salvatore and Maria\'s daughter Eva was born 8.5 months later.',
      'It occurred to you that Eva may be your daughter — a thought you saved and stored for a future need. That time is now! You\'ve come back into Maria\'s life intending to either make a sizeable amount for keeping this quiet, or cause misery by claiming Eva as your own. Maria has already given you $10,000; you intend to ask for a lot more.',
      'By a strange coincidence, you\'ve also come into possession of a letter suggesting that Zia Donatella had an illegitimate daughter. You tracked the daughter down: Dinah Peretti, a cook. You tricked the Morettis\' usual cook into leaving with a fake telegram, and persuaded Dinah to take the temporary position.',
      'You\'ve sent Donatella an anonymous note saying, \'I know what you gave away!\' However, Dinah isn\'t cooperating; she\'s angry with you about the note.',
    ],
    valet: 'This is damned inconvenient. Jones hadn\'t been working for you long, and he didn\'t know anything about your underhand activities. Jones brought you a glass of wine to your room after lunch, but you said you didn\'t want it and made him take it away. You want to find out more about his death.',
    goals: [
      'Blackmail Maria: Make as much money as you can — she\'s given you $10,000 already, but she should be good for at least another $40,000.',
      'The Moretti Diamonds: Try to guarantee yourself a share of the fortune from the diamonds by persuading Dinah to go along with your schemes.',
      'Investigate your valet\'s death: Discover if foul play was behind it. If so, were you the real target?',
      'Avoid Salvatore: He seems suspicious of you. Keep out of his way.',
      'Be careful: There are several people here who have reason to hate you.',
    ],
    firstMoves: [
      'Make sure Dinah Peretti is still going along with your plans for her to be recognized as Donatella\'s daughter.',

    otherPeople: [

    bio: [
      'You are Dr. Sal Bruno, and you were the Moretti family\'s doctor. Although you are retired, you keep your doctor\'s paraphernalia with you out of habit. Nowadays, having no family of your own, you are treated as a dear old family friend and honorary grandparent to the Moretti youngsters.',
      'You were horrified to see Niko Kontos turn up at the lodge. He is calling himself Nick Johnson and masquerading as an old friend of Maria\'s. You have a very personal reason for hating Niko. He seduced and shamed your dear niece, Lucy, resulting in her suicide. You are sure he does not realize who you are.',
      'Worse, Maria confided in you many years ago that Eva may be Niko\'s daughter and not Salvatore\'s.',
      'When Maria told you Niko was blackmailing her, that was the final straw. Even though it goes against your Hippocratic oath, you put some poison in a glass of wine after lunch and asked the valet to take it to Nick/Niko. The man had to be stopped.',
      'Imagine your horror when Salvatore knocked on your door and told you the valet had been found dead in the kitchen! The foolish fellow had drunk it himself! Salvatore asked you and young Charlie Callas, a medical student, to go with him to the scene of death. There was the wine glass, with sediment in the bottom.',
      'What a quandary. You have had to analyze the contents of the glass because of Charlie, and the results are due in half an hour. It will show that the valet was poisoned. You have murdered an innocent man.',
      'What can you do now? You are old and don\'t care about yourself, but you care about Maria and the family. You may be able to eliminate Niko as Eva\'s father. Eva\'s blood type is O; if you analyze Niko\'s blood and discover that it\'s AB, you know he isn\'t Eva\'s father.',
    ],
    valet: 'Terrible. You feel so guilty about being responsible for the death of an innocent man.',
    goals: [
      'Niko Kontos: Use any means you can to prevent Niko from spoiling the happiness of the Moretti family.',
      'Eva\'s parentage: If you can identify Eva\'s father through blood tests, then take it. Destroy the evidence if it turns out to be Niko.',
      'You are a murderer: Find out if the valet was in on Niko\'s evil scheming. If he was, you might feel justified. If he wasn\'t, you might feel compelled to admit to the murder of an innocent man.',
    ],
    firstMoves: [
      'Speak to Nick/Niko alone and warn him you know about his evil ways.',
      'Speak to Charlie about your tests on the wine glass. Try not to make him suspicious.',
    ],
    otherPeople: [
      { name: 'Nick Johnson', note: 'Actually Niko Kontos, an evil swine who should be purged from the world.' },
      { name: 'Salvatore', note: 'You saw him grow up. You have every respect and admiration for him. He looks worried and preoccupied.' },
      { name: 'Maria', note: 'You would do anything for Maria, especially in memory of your dear niece.' },
      { name: 'Jimmy Callas', note: 'Jimmy is Maria\'s brother and would protect her. You think he may know of Niko. Should you take Jimmy into your confidence about what you have done?' },
      { name: 'Charlie Callas', note: 'It\'s awkward having young Charlie be part of the investigation into the valet\'s death. You must be careful to seem surprised when poison is confirmed.' },
      { name: 'Amelia Marchetti', note: 'Amelia is Donatella\'s marvelous friend. Her company is an absolute pleasure, but she has a reputation as an excellent detective, so you\'d better watch what you say.' },
      { name: 'Eva', note: 'Eva is the Morettis\' eldest daughter. How would her life change if she discovered she was illegitimate and not Salvatore\'s daughter?' },
      { name: 'Carmen', note: 'Carmen is the Morettis\' youngest daughter. She is lively and mischievous — it\'s hard to keep her out of anything.' },
    ],
    abilities: [
      { name: 'Astute judge of character', desc: 'Another player must reveal their Secret to you.', uses: 3 },
      { name: 'Sudden insight', desc: 'After talking to another player, you realize they\'ve revealed more than they intended. They must show you their Clue.', uses: 3 },
      { name: 'Tough constitution', desc: 'Thanks to the long, hard hours of a community physician, you are as sturdy as an ox and can ignore the effects of one dose of poison.', uses: 2 },
    ],
    secret: 'Some years ago, Nick Johnson (or rather Niko Kontos, his real name) seduced and shamed your niece, driving her to suicide.',
    clue: 'You know the blood types of: Salvatore, Guido, Carmen — type A; Maria — type B; Zia Donatella, Eva — type O.',
  },
  {
    id: 'reggie_vanni',
    name: 'Reggie Vanni',
    alias: 'The Fox',
    role: 'Friend of Eva\'s',
    initials: 'RV',
    color: '#6B6B2A',
    summary: 'Eva Moretti\'s stylish, socialite friend — sleek, dark evening wear that lets her blend into every corner of the room.',
    bio: [
      'You are Reggie Vanni, a friend of Eva\'s. You first met at a society ball a year or two ago, got on well, and you have visited her several times. You have no family of your own, and when Eva heard you had no plans for this time of year, she invited you to the Morettis\' annual gathering.',
      'And while the above is true, there\'s much more to you than that. Eva (and her family) would be shocked if they knew that you were The Fox — the city\'s notorious cat-burglar. On your last visit to Eva, you noticed a small painting hanging in the drawing room. You suspected it was a painting by Maria Garzoni called Flowers in Blue. It is! The rest of the family has no idea — it would be worth $1 million on the art circuit.',
      'However, your underworld contacts have warned you that someone else, possibly from the FBI, has been asking questions about the painting too. So you must watch your back.',
      'You brought a convincing copy with you. Last night, at about 3 am, you crept down to the drawing room in your mask and swapped the paintings over. Now all you need to do is make it through the next few days, and when the storm breaks, you can walk away with the original.',
      'However, Eva dropped a bombshell on you a few moments ago. She said she saw her Uncle Jimmy, also in a mask, acting suspiciously in the drawing room at about 2 am last night and that he swapped the picture. At this precise moment, you have no idea if you have a genuine or a fake copy of the painting.',
      'If you do have a fake painting, at least you have a genuine antique 1770s flintlock pistol that you took from Christy Cardone\'s room last night. You know a collector you can sell it to.',
    ],
    valet: 'There is enough at stake for you without this complication — especially if the police end up being involved. However, the fact that it was Nick\'s valet makes you suspicious.',
    goals: [
      'Protect your identity: Avoid attracting suspicion. You don\'t want anyone to suspect you are anything other than a relatively well-heeled and vacuous young person.',
      'The painting: Find out what is going on with Jimmy and the painting. Walk away with the real Flowers in Blue, with no one suspecting you of stealing it.',
      'The Moretti Diamonds: Stealing these would be a bonus — but don\'t get caught!',
      'Help Eva: Eva is worried about her mother. Help her however you can.',
    ],
    firstMoves: [
      'Ask Jimmy Callas about what he does for a living.',
      'Talk to Nick Johnson and learn what you can about his friendship with Maria.',
    ],
    otherPeople: [
      { name: 'Eva', note: 'Eva is a charming, if a little spoilt, young woman you find very easy to talk to. She told you about her plans to set up a clothes design company and her father\'s reluctance to help her out with funding.' },
      { name: 'Maria', note: 'Maria is a gracious hostess who has always been kind to you. As Eva says, though, she doesn\'t seem her usual sparkling self.' },
      { name: 'Nick Johnson', note: 'Apparently, Nick is an old friend of Maria\'s, but Eva had never heard of him before. Frankly, he gives you the creeps. Does he seem like an FBI type?' },
      { name: 'Zia Donatella', note: 'The old lady must have the Moretti Diamonds stashed around here somewhere, especially if she plans to hand them to Eva later tonight.' },
      { name: 'Christy Cardone', note: 'Christy has an antique 1770s flintlock pistol that they planned to show to Jimmy.' },
      { name: 'Jimmy Callas', note: 'Eva\'s uncle (and Maria\'s brother). Jimmy is a mystery man. Maybe he knows the actual value of the painting? Is he trying to steal it?' },
      { name: 'Charlie Callas', note: 'Jimmy\'s son is studying medicine at Harvard. You have met him socially once or twice before.' },
    ],
    abilities: [
      { name: 'You\'ve revealed more than you intended', desc: 'Another player has revealed more than they intended and must reveal their Secret to you.', uses: 3 },
      { name: 'Pickpocket', desc: 'Tell the Consigliera what item you want to pickpocket from another player. If that player doesn\'t have it, the Consigliera will take something else at random.', uses: 2 },
      { name: 'Not so fast!', desc: 'An ability played by another player has no effect — but they must still check off a circle. Cannot be used to cancel another Not so fast!. May be used if you are being pickpocketed.', uses: 2 },
    ],
    secret: 'Last night you swapped the picture in the drawing room for a fake.',
    clue: 'Eva saw Uncle Jimmy swapping a picture in the drawing room last night.',
  },
  {
    id: 'christy_cardone',
    name: 'Christy Cardone',
    alias: null,
    role: 'Friend of Guido\'s — heir apparent to a family not unlike this one',
    initials: 'ChC',
    color: '#3A6B3A',
    summary: 'Guido\'s ambitious law-school friend — sharp formalwear with a touch of new-money shine.',
    bio: [
      'You are at Harvard studying law with Guido Moretti and are tipped to become a brilliant lawyer. Your father, Dexter Cardone, built the family\'s fortune out of "manufacturing" — at least, that\'s what goes on the paperwork. The two of you understand each other well enough not to need the rest of the sentence.',
      'You have encountered a fair bit of social snobbery because of your family background. Happily, you\'ve never experienced anything like that from Guido or his family.',
      'When he invited you, Guido mentioned that his uncle, Jimmy, had expressed an interest in seeing the 1770s flintlock pistol that you have as a family heirloom. You brought it with you so that you can show Jimmy. It\'s in your room.',
      'You have another reason for being here, however. You sold Guido a sob story about your parents being away on business, knowing this would probably get you an invite. Your father wants to expand — into laundromats, on paper, and into whatever\'s really running through them, off it. Rumor has it Salvatore Moretti has interests in exactly that kind of business. Your two families have always run in similar circles, if you know what I mean, and you\'re the one your father\'s decided is ready to prove it.',
      'Your father has also heard that Salvatore may be overextended. He\'s sending you to find out what you can about Mr. Moretti\'s plans and discuss a partnership — he\'s authorized up to $1,000,000 for 51% control, and he\'s happy for you to be flexible on the split. But this isn\'t just an errand for you. Your father\'s been talking for a year about eventually handing the business to you, and this could be exactly the move that proves you\'re ready for it.',
      'You chanced to see Maria Moretti and Nick Johnson deep in conversation yesterday. Maria seemed unhappy and seemed to rush away in tears.',
    ],
    valet: 'The atmosphere at the lodge was already tense, and this death will not lighten the load. You feel sorry for Salvatore and Maria having to cope with the situation. Wasn\'t the valet a little young to suffer a heart attack?',
    goals: [
      'Your father\'s business deal: Find out more about Salvatore\'s business plans connected with the laundromats — and what\'s really running through them. Assess if this is a sound opportunity and broker the deal yourself; pull this off, and you\'re one step closer to running things your way. You have authority to spend up to $1,000,000 for 51% ownership, or a smaller amount for a smaller percentage (say $500,000 for 30%).',
      'Support Guido: Guido is your friend, and he is the reason you are here tonight. Help him however you can.',
      'Show Jimmy your flintlock: Show the flintlock to Jimmy. (See the Consigliera to retrieve it from your room.)',
      'Get to know the Moretti family: They could be beneficial to you in your future career.',
      'Maria and Nick relationship: You are curious about the incident you witnessed. Discover more about Nick Johnson.',
    ],
    firstMoves: [
      'Ask Guido about his father\'s business and the rumor that he may be investing further in the laundromats.',
      'Introduce yourself to Jimmy Callas, Salvatore\'s brother-in-law, and find out what he does.',
    ],
    otherPeople: [
      { name: 'Guido', note: 'You are taking the same law course as Guido and have become friends, although you initially pursued the friendship because of his connections.' },
      { name: 'Salvatore', note: 'Salvatore obviously loves his family very much — and, if the rumors are right, runs it the same way your father runs yours. You need to find a way to open a conversation about business, and about what\'s really behind the laundromats.' },
      { name: 'Maria', note: 'Although charming and welcoming, your hostess seems very tense and worried.' },
      { name: 'Jimmy Callas', note: 'According to Guido, Jimmy is interested in seeing your 1770s flintlock pistol.' },
      { name: 'Nick Johnson', note: 'You saw Nick and Maria having what appeared to be a very unhappy conversation. You didn\'t take to him very much.' },
      { name: 'Eva', note: 'Guido\'s older sister. You have met Eva briefly at Harvard when she has visited Guido. She is vivacious and outgoing, but you get the impression she is a little spoilt.' },
    ],
    abilities: [
      { name: 'Sudden insight', desc: 'After talking to another player, you realize they\'ve revealed more than they intended. They must show you their Clue.', uses: 3 },
      { name: 'You\'ve revealed more than you intended', desc: 'Another player has revealed more than they intended and must reveal their Secret to you.', uses: 2 },
      { name: 'Flattery', desc: 'If you flatter another player, they must read out to you the first goal listed on their character sheet.', uses: 3 },
    ],
    secret: 'Your father has sent you to broker a business partnership with Salvatore Moretti — the Cardones and the Morettis have always been in similar lines of work, and closing this deal would prove you\'re ready to take over the family business yourself.',
    clue: 'You saw Maria Moretti and Nick Johnson having a dispute. Maria went away crying.',
  },
  {
    id: 'amelia_marchetti',
    name: 'Amelia Marchetti',
    alias: null,
    role: 'Amateur detective — Donatella\'s oldest friend',
    initials: 'AM',
    color: '#5A2A6B',
    summary: 'Donatella\'s eccentric old friend and self-styled detective — a sharp pant suit, a magnifying glass, and eyes that miss nothing.',
    bio: [
      'You are Amelia Marchetti, amateur detective and a school friend of Zia Donatella, who you know as Donna. You are joining your good friend for her family\'s Christmas Eve gathering, but you think this may be your last visit to America, as you are getting too elderly to travel comfortably.',
      'Your family emigrated to America when you were 15 years old. You met Donatella at school and have been the closest of friends ever since, writing and visiting frequently since your family returned to Italy.',
      'You think the Morettis see you as a dear, sweet, quaint and rather nosy old lady — which you are. But back home, you have earned the reputation of being a formidable detective who has helped solve many crimes through your understanding of human nature and your sharp powers of observation.',
      'You share Donatella\'s greatest secret — that she was once secretly engaged to Rory Calhoun, the love of her life. Rory was killed in an army training exercise shortly before Donatella discovered she was pregnant. Her father hushed this up and arranged to have the baby adopted. The poor little mite was a girl, and you slipped your gold locket around her neck before she was taken away.',
      'Donatella has shown you a horrible anonymous note she received a few days ago. It simply says, \'I know what you gave away.\' Donatella has also confided that she seems to have misplaced her Moretti Diamonds! In your experience, something of that value is rarely \'misplaced.\'',
      'You have watched everyone closely over the last few days, and you are worried for your friend and her family — you can\'t help feeling there is something evil going on.',
    ],
    valet: 'It\'s always so sad to hear of the death of a young person. But what could have brought on a heart attack? With so much going on, was it really death from natural causes?',
    goals: [
      'Support Donatella: Donatella is your good friend, support and help her however you can.',
      'The Moretti Diamonds: Find out what has happened to them — are they \'misplaced\' or maybe stolen? Then, restore them to Donatella in time for them to be handed to Eva.',
      'The note: Discover who sent the sinister note to Donatella and why, and what they want.',
      'Maria and Salvatore: Find out what is going on between them and why they look so unhappy.',
      'Nick Johnson: Find out more about him and his connection with Dinah, the cook.',
    ],
    firstMoves: [
      'Help Donatella remember what she might have done with the diamonds. Reassure her about the mysterious note and promise you will help.',
      'Ask everyone what they know about Nick. Try to find out from Dinah Peretti what their discussion was about.',
    ],
    otherPeople: [
      { name: 'Zia Donatella', note: 'You have a wonderful friendship. Help her remember what she did with the diamonds and help her get to the bottom of that disgraceful note.' },
      { name: 'Salvatore', note: 'Your host, Salvatore, is a family man through and through, but things between him and Maria appear strained.' },
      { name: 'Maria', note: 'Maria is such a charming woman! But she looks worried — and you have seen her having what looked like words with Nick Johnson.' },
      { name: 'Charlie Callas', note: 'Charlie has quite a wild streak and is in trouble again, if you\'re not mistaken. You saw him talking earnestly to Aunt Maria — you saw her shake her head sorrowfully at him.' },
      { name: 'Jimmy Callas', note: 'You understand that Jimmy is in the arts and antiquities business. You think that his air of dreaminess and vagueness hides a very sharp mind.' },
      { name: 'Dr. Sal Bruno', note: 'It is lovely to see the old doctor again. For the last day or so, the doctor has looked terrible. You\'ve seen them muttering to themselves, seemingly in a great dilemma.' },
      { name: 'Carmen', note: 'Carmen is Salvatore and Maria\'s younger daughter. She has asked you for tips about detecting The Fox.' },
    ],
    abilities: [
      { name: 'What can you tell me about that person over there?', desc: 'After talking to another player, indicate a third player. The player you are talking to must tell you everything their Other People section says about that third player. Do not cross off a use if the third player isn\'t mentioned.', uses: 3 },
      { name: 'I\'d like to ask you a few questions...', desc: 'Speak to another player and reveal that you are an amateur detective. They must reveal their Clue to you. One use per player.', uses: 1, perPlayer: true },
      { name: 'Astute judge of character', desc: 'Another player must reveal their Secret to you.', uses: 2 },
    ],
    secret: 'You helped Donatella cover up the existence of the child she once had, and now are helping her secretly look for the lost Moretti Diamonds.',
    clue: 'Zia Donatella recently received a threatening note.',

  {
    id: 'dinah_peretti',
    name: 'Dinah Peretti',
    alias: null,
    role: 'Temporary cook',
    initials: 'DP',
    color: '#8B6B3A',
    summary: 'The temporary cook filling in for the night — simple, practical kitchen attire, an apron over your nicest dress.',
    bio: [
      'You are Dinah Peretti, a good cook looking for a job. You have no family and are delighted to have landed this temporary job, even if it\'s only for the party. It\'s nice to have a change of scenery.',
      'Some of that is a lie. You are an excellent cook, but you do already have a job. You are working here during your vacation to learn more about your past. You were adopted as a baby, and the only clue you had to your identity is a small gold locket that carries the inscription \'Forever Friends.\'',
      'A few months ago, Niko Kontos contacted you. Niko claims to have a letter proving that Zia Donatella had an illegitimate daughter given into an orphanage\'s care. Niko believes you are that child. If this were true, you could end up quite wealthy and, at the very least, in possession of the famous Moretti Diamonds.',
      'You do not like or trust Niko. He seems to have some hold over Maria Moretti, as she is colluding in his pretense of being an old friend called Nick Johnson.',
      'Niko wanted you to join him in blackmailing Zia Donatella. He told you he has sent Donatella a threatening note saying, \'I know what you gave away.\' You were angry about this. You want what is legally due to you — but you do NOT agree with blackmail.',
      'There\'s one thing that Niko doesn\'t know, which may help. The first time you met Zia Donatella, you noticed she was wearing an identical gold locket to the one you have!',
      'Finding the body of Niko\'s valet in the kitchen this afternoon was a real shock. You immediately fetched Salvatore. There was an empty wine glass next to the body, it smelled odd, and there was sediment in the glass. You have been sworn to secrecy about these circumstances.',
    ],
    valet: 'It looks suspicious to you. You\'re sure Niko will want to hear about you finding the body. Should you tell him about the glass?',
    goals: [
      'Your identity: Find out if you are Zia Donatella\'s daughter. If you are, who was your father and why did they give you away?',
      'Niko and Maria: What hold does Niko have over Maria? And decide whether you should help her or not.',
      'Do what is right: Avoid being implicated in any evil scheme of Niko\'s. Make sure that any means you use are above board.',
      'Wealth and riches: Find out if you are legally entitled to anything — and if you are, go all out to get it.',
    ],
    firstMoves: [
      'Talk to Niko/Nick and discover what he is planning.',
      'Speak to Amelia Marchetti to see if you could trust her to help you with approaching Zia Donatella.',
    ],
    otherPeople: [
      { name: 'Nick Johnson', note: 'His real name is Niko Kontos, and you don\'t trust him. Although he is helping you find your mother, you\'re sure it\'s not out of the goodness of his heart!' },
      { name: 'Salvatore', note: 'Salvatore seems like a decent man.' },
      { name: 'Maria', note: 'Maria has been lovely to you and seems grateful that you have taken the temporary position. She looks very nervous and upset about something, though, which seems to relate to Niko.' },
      { name: 'Zia Donatella', note: 'Can she really be your mother? What could have made her give you away, if so?' },
      { name: 'Amelia Marchetti', note: 'An elderly lady who seems great friends with Donatella. You hear that she is a famous detective. She has certainly given you a few sharp looks, which makes you nervous.' },
      { name: 'Eva', note: 'Eva is Donatella\'s oldest great-niece and is next in line for the Moretti Diamonds. She seems spoilt, to you.' },
      { name: 'Carmen', note: 'The youngest great-niece. Her pet monkey is a real nuisance, though.' },
    ],
    abilities: [
      { name: 'Sudden insight', desc: 'After talking to another player, you realize they\'ve revealed more than they intended. They must show you their Clue.', uses: 3 },
      { name: 'Nobody notices a servant', desc: 'When you see a conversation taking place that you\'d like to secretly overhear, tell the Consigliera, and they will listen in and report back to you what\'s being talked about. Please do not play this if the Consigliera is busy!', uses: 3 },
      { name: 'Success!', desc: 'You can make a failed or tied rock-paper-scissors challenge succeed. It does not have to be a challenge you are involved in.', uses: 3 },
    ],
    secret: 'Nick\'s real name is Niko Kontos, and he believes you are Zia Donatella\'s illegitimate daughter.',

  {
    id: 'enzo_rizzo',
    name: 'Enzo Rizzo',
    alias: null,
    role: 'Il Leone\'s right hand — and the family\'s fixer',
    initials: 'ER',
    color: '#3A3030',
    summary: 'Il Leone\'s right hand — a sharp black suit, no tie clip, no flash, always a half-step behind Salvatore\'s shoulder. Quiet, watchful, loyal to the bone.',
    bio: [
      'You are Enzo Rizzo — Il Leone\'s right hand. You have been at Mr. Salvatore Moretti\'s side for many years, and in that time you\'ve learned to handle the sort of problems that never get written down: a debt collected quietly, a message delivered without being traced, a difficult conversation smoothed over before it becomes a difficult night. You are utterly loyal to the family, and they trust you with things they\'d never tell each other.',
      'You usually enjoy the annual trip to the lodge; it\'s a change of scenery, and it\'s good to see Mr. Salvatore relaxing with the family and away from his business duties for a while. However, this year, not all is running as smoothly as usual.',
      'Your first problem was arranging a replacement when the usual cook was called away to her mother\'s sickbed. Given the family business, you must take extra precaution when hiring help — but you and Mrs. Moretti were relieved to find Dinah Peretti as a temporary replacement, although you didn\'t have time to take proper references for her. Nevertheless, she seems to be an excellent cook.',
      'Then there\'s Mr. Nick Johnson, a surprise guest who claims to be an old friend of Mrs. Moretti. Mrs. Moretti doesn\'t seem that pleased to see him, but you saw to it personally that a room was made ready for him. (You were surprised to see Dinah talking at length to Mr. Johnson, so you must keep an eye on her.)',
      'Mr. and Mrs. Moretti both seem out of sorts and very subdued. Young Miss Carmen is also a worry. You\'d stepped into her room yesterday to check the window latch before the storm got worse, and saw a diamond necklace sitting out on the dressing table!',
      'You are sure that Carmen doesn\'t have such a sophisticated piece of jewelry, and you are worried what mischief she may be up to now — or more likely, what mischief that wretched pet monkey of hers is getting her into. That little pest is always stealing things.',
      'Finally, there is the death of the valet this morning. Mr. Moretti has kept you in his confidence. There was an empty wine glass next to the body, with a strange residue at the bottom.',
      'Salvatore asked Dr. Bruno and Mr. Charlie Callas to analyze the residue, and the results should be known within the next half hour.',
      'Mr. Jimmy Callas is an interesting fellow. Last year he took you into his confidence. He works as an agent for the FBI, investigating thefts of art. You would never have guessed if he hadn\'t told you; he seems such a gentleman. He has seemed somewhat edgy during this visit, even before the death of the valet.',
    ],
    valet: 'It does look suspicious — and Dinah \'found\' the body, which adds to your suspicion about her. You also have your doubts about the valet\'s employer, Mr. Johnson. You will need to keep your wits about you.',
    goals: [
      'Keep Miss Carmen out of trouble: Talk to Miss Carmen about the diamond necklace and discover where it has come from.',
      'Keep an eye on Dinah: You have doubts about Dinah\'s dedication to the job.',
      'Protect the Moretti family: You are pleased to have been taken into Mr. Moretti\'s confidence about the valet\'s death, and will assist your employer however you can.',
      'Help Mr. Jimmy Callas: Or at least find out what he\'s worried about.',
    ],
    firstMoves: [
      'Tell Miss Carmen you were checking her window latch and couldn\'t help noticing the necklace.',
      'Ask Dinah Peretti if she knows Mr. Johnson.',
    ],
    otherPeople: [
      { name: 'Mr. and Mrs. Moretti', note: 'Your family, in every way that matters. You\'ve stood at Mr. Moretti\'s side for a long time, and you are loyal to him — loyal enough that you know more about his real business than almost anyone. Unfortunately, he works too hard and is showing the strain, and maybe this is making Mrs. Moretti so ill at ease.' },
      { name: 'Miss Eva, Mr. Guido, Miss Carmen', note: 'You have known them since they were babies. You are particularly fond of Miss Carmen, and have often helped her in the past.' },
      { name: 'Mr. Jimmy Callas', note: 'Maria\'s older brother. You know that he also works for the FBI, investigating art crimes.' },
      { name: 'Mr. Charlie Callas', note: 'Jimmy\'s son and Mrs. Moretti\'s nephew. Charlie is treated like a second son, having lost his mother some time ago.' },
      { name: 'Zia Donatella', note: 'Mr. Moretti\'s elderly great-aunt is often forgetful these days. She owns some diamonds — but you\'re sure they\'re not the ones you saw in Miss Carmen\'s room.' },
      { name: 'Miss Amelia Marchetti', note: 'The elderly friend of Zia Donatella, rumored to be a famed detective.' },
      { name: 'Mr. Nick Johnson', note: 'This gentleman turned up a few days ago and said he was an old friend of Mrs. Moretti. She doesn\'t seem pleased to see him.' },
      { name: 'Dinah Peretti', note: 'Dinah is a marvelous cook, but since you saw her talking intently to Nick Johnson, you have a nagging doubt about her.' },
    ],
    abilities: [
      { name: 'Astute judge of character', desc: 'Another player must reveal their Secret to you.', uses: 3 },
      { name: 'Nobody notices him', desc: 'When you see a conversation taking place that you\'d like to secretly overhear, tell the Consigliera, and they will listen in and report back to you what\'s being talked about. Please do not play this if the Consigliera is busy!', uses: 3 },
      { name: 'I couldn\'t possibly comment', desc: 'You are extremely discreet. If anyone plays an ability on you to make you reveal your Clue, a goal, or information about another person, you can ignore it. But they must still check off a circle.', uses: 2 },
    ],
    secret: 'You have no secrets. (If someone uses an ability to make you reveal this, they do not have to check off a use of it.)',
    clue: 'You saw what appeared to be a diamond necklace in Miss Carmen\'s room a day ago.',
  },
];

// ── Color lookup for Other People avatars ──
const CHAR_COLORS = {};
CHARACTERS.forEach(c => { CHAR_COLORS[c.id] = c.color; });
const NAME_KEYS = {
  'salvatore': 'salvatore_moretti', 'maria': 'maria_moretti', 'eva': 'eva_moretti',
  'nick': 'nick_johnson', 'guido': 'guido_moretti', 'carmen': 'carmen_moretti',
  'donatella': 'zia_donatella', 'zia donatella': 'zia_donatella', 'jimmy': 'jimmy_callas',
  'charlie': 'charlie_callas', 'dr. bruno': 'dr_sal_bruno', 'dr bruno': 'dr_sal_bruno',
  'dr. sal bruno': 'dr_sal_bruno', 'sal bruno': 'dr_sal_bruno', 'reggie': 'reggie_vanni',
  'christy': 'christy_cardone', 'amelia': 'amelia_marchetti', 'dinah': 'dinah_peretti',
  'enzo': 'enzo_rizzo',
};
function colorFor(name) {
  const k = name.toLowerCase().replace(/^(mr\.|mrs\.|miss|dr\.|zia)\s+/i,'').trim();
  for (const [key, id] of Object.entries(NAME_KEYS)) {
    if (k.startsWith(key)) return CHAR_COLORS[id] || '#6B5E50';
  }
  return '#6B5E50';
}
function initialsFor(name) {
  const clean = name.replace(/^(Mr\.|Mrs\.|Miss|Dr\.|Zia)\s+/i,'').trim();
  const parts = clean.split(/[\s,&]+/);
  return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

// ── REVEAL TIME: 9am CET (UTC+1) Wednesday 19 August 2026 ──
const REVEAL_AT = new Date('2026-08-19T09:00:00+01:00').getTime();

// ── GAME START: 5pm CET (UTC+2 in August) Saturday 22 August 2026 ──
// Once we cross this, players can only mark uses SPENT — they can no
// longer un-check a circle to recover a use.
const GAME_START_AT = new Date('2026-08-22T17:00:00+02:00').getTime();

// ── APP ──
const { createApp, ref, computed, onMounted } = Vue;

createApp({
  setup() {
    const char      = ref(null);
    const uses      = ref([]);
    const bioOpen   = ref(false);
    const revSecret = ref(false);
    const revClue   = ref(false);
    const rulesOpen = ref(false);
    const treeOpen  = ref(false);
    const now       = ref(Date.now());

    const isRevealed = computed(() => now.value >= REVEAL_AT);
    const isLive     = computed(() => now.value >= GAME_START_AT);
    const countdown  = computed(() => {
      const diff = REVEAL_AT - now.value;
      if (diff <= 0) return null;
      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins  = Math.floor((diff % 3600000) / 60000);
      const secs  = Math.floor((diff % 60000) / 1000);
      return { days, hours, mins, secs };
    });
    const gameCountdown = computed(() => {
      const diff = GAME_START_AT - now.value;
      if (diff <= 0) return null;
      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins  = Math.floor((diff % 3600000) / 60000);
      const secs  = Math.floor((diff % 60000) / 1000);
      return { days, hours, mins, secs };
    });

    onMounted(() => {
      const id = sessionStorage.getItem('sicilian_char_id');
      if (!id || id === '_orchestrator') { window.location.href = '../login/index.html'; return; }
      const found = CHARACTERS.find(c => c.id === id);
      if (!found) { window.location.href = '../login/index.html'; return; }
      char.value = found;

      // Load or initialise ability uses from localStorage
      const saved = localStorage.getItem(`sicilian_uses_${id}`);
      uses.value = saved ? JSON.parse(saved) : found.abilities.map(() => 0);

      // If the game has already started by the time this page loads,
      // reset immediately (only once per character).
      maybeResetForGameStart();

      // Tick every second until we've passed both the reveal and the
      // game-start moment, so both isRevealed and isLive flip live if
      // the page happens to stay open across either boundary.
      const stopAt = Math.max(REVEAL_AT, GAME_START_AT);
      if (Date.now() < stopAt) {
        const timer = setInterval(() => {
          now.value = Date.now();
          maybeResetForGameStart();  // fires the moment we cross 5pm
          if (now.value >= stopAt) clearInterval(timer);
        }, 1000);
      }
    });

    function save() {
      if (char.value) localStorage.setItem(`sicilian_uses_${char.value.id}`, JSON.stringify(uses.value));
    }

    // Wipe ability uses the first time this character's page notices we've
    // crossed GAME_START_AT — so every player starts the game with a clean
    // sheet, regardless of how much they'd toggled during the preview days.
    // Idempotent: a per-character flag in localStorage stops it firing twice.
    function maybeResetForGameStart() {
      if (!char.value) return;
      if (Date.now() < GAME_START_AT) return;
      const flagKey = `sicilian_gamestart_reset_${char.value.id}`;
      if (localStorage.getItem(flagKey)) return;
      uses.value = char.value.abilities.map(() => 0);
      save();
      localStorage.setItem(flagKey, '1');
    }

    function toggle(ai, n) {
      const current = uses.value[ai];
      if (n <= current) {
        // Trying to un-check a circle — only allowed before the game starts.
        if (isLive.value) return;
        uses.value[ai] = n - 1;
      } else {
        uses.value[ai] = n;
      }
      save();
    }
    function inc(ai) { uses.value[ai]++; save(); }
    function dec(ai) {
      if (isLive.value) return;
      if (uses.value[ai] > 0) { uses.value[ai]--; save(); }
    }

    function logout() {
      sessionStorage.removeItem('sicilian_char_id');
      window.location.href = '../login/index.html';
    }

    return {
      char, uses, bioOpen, revSecret, revClue, rulesOpen, treeOpen,
      isRevealed, isLive, countdown, gameCountdown,
      toggle, inc, dec, logout, colorFor, initialsFor,
    };
  }
}).mount('#app');

</script>
</body>
</html>
